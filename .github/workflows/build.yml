name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MyGit.slnx

      - name: Build
        run: dotnet build MyGit.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test MyGit.slnx --no-build --configuration Release
