name: Release

# Push a version tag to publish a release: git tag v1.2.0 && git push origin v1.2.0
# The release gets Setup.exe for Windows and My Git.app (zip and .pkg) for Apple Silicon Macs,
# plus each platform's update packages and feed, which the installed apps check for updates.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release and upload its files

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version from the tag
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test MyGit.slnx --configuration Release

      - name: Publish
        run: dotnet publish src/MyGit.App/MyGit.App.csproj --configuration Release --runtime win-x64 --self-contained -p:Version=${{ env.VERSION }} --output publish

      - name: Install vpk
        run: dotnet tool install --global vpk --version 1.2.161

      # The previous release lets vpk build a small "delta" update (only what changed) next to the full one.
      - name: Download the previous release
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Pack
        run: vpk pack --packId MyGit --packVersion ${{ env.VERSION }} --packDir publish --mainExe MyGit.exe --packTitle "My Git" --packAuthors Horothenic --icon branding/my-git.ico

      - name: Publish the GitHub Release
        run: vpk upload github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --publish --releaseName "My Git ${{ env.VERSION }}" --tag ${{ github.ref_name }}

  # Runs after Windows created the release, and adds the Mac files (and the Mac update feed) to it.
  mac:
    needs: windows
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish for Apple Silicon
        run: dotnet publish src/MyGit.App/MyGit.App.csproj --configuration Release --runtime osx-arm64 --self-contained -p:Version=${{ env.VERSION }} --output publish

      - name: Install vpk
        run: dotnet tool install --global vpk --version 1.2.161

      - name: Download the previous Mac release
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # Not signed by Apple yet (no Developer ID): the first open needs the quarantine step; updates then work as usual.
      - name: Pack
        run: vpk pack --packId MyGit --packVersion ${{ env.VERSION }} --packDir publish --mainExe MyGit --packTitle "My Git" --packAuthors Horothenic --bundleId com.horothenic.mygit --icon branding/my-git.icns

      - name: Add to the GitHub Release
        run: vpk upload github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --merge --releaseName "My Git ${{ env.VERSION }}" --tag ${{ github.ref_name }}
